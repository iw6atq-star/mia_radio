name: Crea il mio file EXE

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Estrai il codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le librerie
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install Pillow sounddevice imageio-ffmpeg pyinstaller

      - name: Compila Radio Solaris Desktop
        shell: cmd
        run: |
          python -m PyInstaller --noconsole --onefile --clean --name=RadioSolaris --collect-all imageio_ffmpeg --collect-all sounddevice app.py

      - name: Salva il file EXE
        uses: actions/upload-artifact@v4
        with:
          name: Applicazione-Radio-Windows
          path: dist/RadioSolaris.exe
          if-no-files-found: error
