name: Crea il mio file EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Estrai il codice
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa le librerie indispensabili
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pyinstaller

    - name: Compila in file EXE unico e blindato
      shell: cmd
      run: |
        python -m PyInstaller --noconsole --onefile app.py

    - name: Salva il file compilato
      uses: actions/upload-artifact@v4
      with:
        name: Applicazione-Radio-Windows
        path: dist/app.exe
